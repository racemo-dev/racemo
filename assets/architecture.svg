<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="100%" style="max-width: 800px;" role="img" aria-labelledby="racemo-arch-title racemo-arch-desc">
  <title id="racemo-arch-title">Racemo architecture</title>
  <desc id="racemo-arch-desc">Layered architecture: React + xterm.js frontend, Tauri IPC bridge, Tauri App and racemo-server daemon (two Rust binaries), Unix Socket / Named Pipe MessagePack IPC, and OS PTY platform layer.</desc>
  <style>
    .box { fill: #ffffff; stroke: #d4d4d8; stroke-width: 1.5; }
    .server-box { fill: #faf5ff; stroke: #c4b5fd; stroke-width: 1.5; }
    .title { font: 600 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #18181b; }
    .sub { font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #52525b; }
    .mono { font: 500 11px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #52525b; }
    .tag { font: 600 10px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #7c3aed; letter-spacing: 0.08em; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #0f0f11; stroke: #3f3f46; }
      .server-box { fill: #1e1b4b; stroke: #6d28d9; }
      .title { fill: #fafafa; }
      .sub { fill: #a1a1aa; }
      .mono { fill: #a1a1aa; }
      .tag { fill: #a78bfa; }
    }
  </style>

  <!-- Layer 1: Frontend -->
  <rect class="box" x="40" y="20" width="640" height="64" rx="8"/>
  <text class="title" x="360" y="48" text-anchor="middle">React + xterm.js</text>
  <text class="sub" x="360" y="68" text-anchor="middle">TypeScript frontend</text>
  <text class="tag" x="700" y="57">UI</text>

  <!-- Layer 2: Tauri IPC Bridge -->
  <rect class="box" x="40" y="94" width="640" height="60" rx="8"/>
  <text class="title" x="360" y="122" text-anchor="middle">Tauri IPC Bridge</text>
  <text class="sub" x="360" y="142" text-anchor="middle">commands &amp; events</text>
  <text class="tag" x="700" y="129">BRIDGE</text>

  <!-- Layer 3a: Tauri App (left) -->
  <rect class="box" x="40" y="164" width="312" height="86" rx="8"/>
  <text class="title" x="196" y="192" text-anchor="middle">Tauri App</text>
  <text class="sub" x="196" y="212" text-anchor="middle">GUI window + command handlers</text>
  <text class="mono" x="196" y="232" text-anchor="middle">(Rust)</text>

  <!-- Layer 3b: racemo-server (right) -->
  <rect class="server-box" x="368" y="164" width="312" height="86" rx="8"/>
  <text class="title" x="524" y="192" text-anchor="middle">racemo-server</text>
  <text class="sub" x="524" y="212" text-anchor="middle">PTY daemon + session state</text>
  <text class="mono" x="524" y="232" text-anchor="middle">(Rust)</text>

  <text class="tag" x="700" y="211">BINARIES</text>

  <!-- Layer 4: IPC Protocol -->
  <rect class="box" x="40" y="260" width="640" height="60" rx="8"/>
  <text class="title" x="360" y="288" text-anchor="middle">Unix Socket · Named Pipe</text>
  <text class="sub" x="360" y="308" text-anchor="middle">length-prefixed MessagePack</text>
  <text class="tag" x="700" y="295">IPC</text>

  <!-- Layer 5: OS PTY -->
  <rect class="box" x="40" y="330" width="640" height="64" rx="8"/>
  <text class="title" x="360" y="358" text-anchor="middle">OS PTY</text>
  <text class="sub" x="360" y="378" text-anchor="middle">posix pty / Windows ConPTY</text>
  <text class="tag" x="700" y="367">PLATFORM</text>
</svg>
